name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    env:
      AGENT_EVAL_TEST_POSTGRES_DSN: postgresql://postgres:agent_eval_local@127.0.0.1:5432/agent_eval
    services:
      postgres:
        image: postgres@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_DB: agent_eval
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: agent_eval_local
          POSTGRES_INITDB_ARGS: --data-checksums
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agent_eval"
          --health-interval 1s
          --health-timeout 3s
          --health-retries 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.29"
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Sync locked environment
        run: uv sync --frozen --dev

      - name: Lint
        run: uv run --frozen ruff check .

      - name: Type-check
        run: uv run --frozen mypy

      - name: Test with package branch coverage
        run: |
          uv run --frozen coverage run -m pytest
          uv run --frozen coverage report

      - name: Verify frozen and regenerated evidence
        run: uv run --frozen agent-eval-reproduce --verify
