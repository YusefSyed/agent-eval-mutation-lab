[project]
name = "agent-eval-mutation-lab"
version = "0.4.0"
description = "Typed deterministic mutation engine for execution-semantic agent scorers"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Yusef Syed" }]
keywords = [
  "agent-evaluation",
  "ai-safety",
  "mutation-testing",
  "reliability",
  "reproducible-research",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
distributed = [
  "psycopg[binary,pool]>=3.2,<4",
]

[project.scripts]
agent-eval-mutation = "agent_eval_mutation_lab.cli:main"
agent-eval-inspect = "agent_eval_mutation_lab.inspect_adapter:main"
agent-eval-ablate = "agent_eval_mutation_lab.receipt_ablations:main"
agent-eval-verify-lock = "agent_eval_mutation_lab.baseline_lock:main"
agent-eval-v2 = "agent_eval_mutation_lab.v2_evaluation:main"
agent-eval-build-review = "agent_eval_mutation_lab.review_packet:main"
agent-eval-verify-review = "agent_eval_mutation_lab.review_verifier:main"
agent-eval-family-sensitivity = "agent_eval_mutation_lab.family_sensitivity:main"
agent-eval-validate-holdout = "agent_eval_mutation_lab.holdout_intake:main"
agent-eval-ownership-preflight = "agent_eval_mutation_lab.ownership_readiness:main"
agent-eval-reproduce = "agent_eval_mutation_lab.reproduction:main"
agent-eval-engine = "agent_eval_mutation_lab.engine.cli:main"
agent-eval-mutate-v2 = "agent_eval_mutation_lab.mutation_benchmark.cli:main"
agent-eval-model-study = "agent_eval_mutation_lab.model_study.cli:main"
agent-eval-distributed-benchmark = "agent_eval_distributed.benchmark:main"

[dependency-groups]
dev = [
  "coverage>=7.15.4",
  "mypy>=1.18.0",
  "psycopg[binary,pool]>=3.2,<4",
  "pytest>=8.4.0",
  "ruff>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_eval_mutation_lab", "src/agent_eval_distributed"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"research/build_report.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["agent_eval_mutation_lab", "agent_eval_distributed"]

[tool.coverage.run]
branch = true
source = ["agent_eval_mutation_lab", "agent_eval_distributed"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
