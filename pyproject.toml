[project]
name = "agent-eval-mutation-lab"
version = "0.1.0"
description = "Offline mutation benchmark for execution-semantic agent scorers"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Yusef Syed" }]
dependencies = []

[project.scripts]
agent-eval-mutation = "agent_eval_mutation_lab.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.18.0",
  "pytest>=8.4.0",
  "ruff>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_eval_mutation_lab"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"research/build_report.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["agent_eval_mutation_lab"]
