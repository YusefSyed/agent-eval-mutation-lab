services:
  default:
    build:
      context: .
    x-local: true
    init: true
    user: "10001:10001"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 0.5
    mem_limit: 128m
    pids_limit: 32
    tmpfs:
      - /state:size=16m,uid=10001,gid=10001,mode=0700,nosuid,noexec
      - /tmp:size=16m,uid=10001,gid=10001,mode=0700,nosuid,noexec
    ulimits:
      nofile: {soft: 128, hard: 128}
